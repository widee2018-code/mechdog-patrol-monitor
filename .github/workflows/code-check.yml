# 푸시와 PR마다 코드가 깨지지 않았는지 본다 (로봇·C1·BreezySLAM 없이 약 2분).
# 1) 모든 .py 문법 확인  2) tests/ci_smoke.py: 공개 주소 조작 막기(허브), frontier 시뮬레이터,
#    frontier_drive 상태 기계(자동·--confirm·초음파). 로컬에서도 같은 명령: python tests/ci_smoke.py
# push 를 막지는 않고, 실패하면 GitHub 에 빨간 ✗ 가 뜬다.
name: code-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx numpy opencv-python-headless matplotlib

      - name: Syntax (all .py)
        run: python -m compileall -q brain tools server recorder firmware tests

      - name: Smoke tests
        env:
          MPLBACKEND: Agg
        run: python tests/ci_smoke.py
