<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼굴 + 행동 1안 · 기본 반반형</title>
<link rel="stylesheet" href="cam_style.css">
<style>
/* 1안 기본 반반형: 왼쪽 얼굴(지금 판정 + 2안 갤러리), 오른쪽 행동(위험도 + 위험 행동 9가지). */
.cam { aspect-ratio: 16 / 10; }
.now2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.now2 .big { font-size: 24px; font-weight: 800; }
.votes { display: flex; gap: 4px; } .votes i { width: 12px; height: 12px; border-radius: 3px; background: #1a2330; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>얼굴 + 행동 · 1안 기본 반반형</b><small>왼쪽 얼굴 추론 · 오른쪽 행동 추론 · 같은 Dog A 카메라</small></div>
  <span class="mock">가짜 데이터</span>
  <nav class="nav" aria-label="시안 이동"></nav>
</header>
<div class="band" id="band" aria-live="polite"></div>
<div class="halves">
  <section class="half" aria-label="얼굴 추론">
    <div class="hh"><b>👤 얼굴 추론</b><small>등록된 팀원인지만 봐요</small></div>
    <div class="cam"><canvas id="cvF"></canvas><span class="tag" id="tagF">—</span></div>
    <div class="card now2"><div><div class="muted" style="font-size:12px">지금 판정</div><div class="big" id="fBig">—</div><div class="muted" id="fSub" style="font-size:12.5px">—</div></div>
      <div><div class="muted" style="font-size:11.5px;margin-bottom:4px">최근 5장 (3장 같으면 확정)</div><div class="votes" id="fVotes"></div></div></div>
    <div class="card"><h3><span>다녀간 사람</span><span class="muted">범인 → 미등록 → 보류 → 등록</span></h3><div class="gal" id="gal"></div></div>
  </section>
  <section class="half" aria-label="행동 추론">
    <div class="hh"><b>🏃 행동 추론</b><small>YOLO11n-pose 몸 점 17개</small></div>
    <div class="cam"><canvas id="cvP"></canvas><span class="tag" id="tagP">—</span></div>
    <div class="card now2"><div><div class="muted" style="font-size:12px">지금 위험도</div><div class="big" id="pBig">—</div><div class="muted" id="pSub" style="font-size:12.5px">—</div></div></div>
    <div class="card"><h3><span>위험 행동 9가지</span><a href="danger_actions.html" style="color:var(--info);font-size:12px">규칙 보기 →</a></h3><div id="dl"></div></div>
  </section>
</div>

<script src="cam_mock.js"></script>
<script src="combo_ui.js"></script>
<script>
const M = CamMock, U = ComboUI; M.nav("combo1");
const sim = M.comboSim({ frameW: 640, offset: +(new URLSearchParams(location.search).get("t") || 0) });
const $ = (id) => document.getElementById(id);
let acc = 0;
M.loop((dt) => {
  const st = sim.step(dt);
  U.drawFaceView($("cvF"), st); U.drawPoseView($("cvP"), st);
  $("tagF").textContent = $("tagP").textContent = `${M.clock(st.t)} · 사람 ${st.person ? 1 : 0}`;
  acc += dt; if (acc < 0.2) return; acc = 0;
  U.band($("band"), st);
  const p = st.person;
  $("fBig").textContent = p ? U.V[p.state].ko : "사람 없음"; $("fBig").style.color = p ? U.V[p.state].color : "var(--muted)";
  $("fSub").textContent = p ? `가장 비슷: ${p.best} ${p.score.toFixed(2)} (기준 0.60) · 얼굴 ${p.px.toFixed(0)}px` : "—";
  $("fVotes").innerHTML = p ? p.votes.map((v) => `<i style="background:${U.V[v].color}"></i>`).join("") : "";
  const on = st.person ? st.active.filter((a) => a.level !== "pending") : [];
  const risk = st.person ? st.risk : "none";
  $("pBig").textContent = M.LEVEL[risk].ko; $("pBig").style.color = U.RISK_COL[risk];
  $("pSub").textContent = on.length ? on.map((a) => `${a.ko} (${a.why})`).join(" · ") : "위험한 행동이 없어요";
  U.dangerList($("dl"), st.person ? st : { active: [] });
  U.gallery($("gal"), st);
});
</script>
</body>
</html>
