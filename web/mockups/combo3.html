<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼굴 + 행동 3안 · 분석 · 조절형</title>
<link rel="stylesheet" href="cam_style.css">
<style>
/* 3안 분석 · 조절형: 왼쪽 얼굴 기준 슬라이더 + 2안 갤러리, 오른쪽 규칙 숫자 계기판(행동 6안) + 위험 행동 9가지. 숫자를 맞출 때 쓰는 화면. */
.cam { aspect-ratio: 16 / 10; }
.tune label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12.5px; margin-bottom: 8px; }
.tune input { grid-column: 1 / -1; width: 100%; accent-color: var(--info); }
.tune output { font-weight: 700; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.mt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 12px; margin-bottom: 8px; }
.mt .bar { grid-column: 1 / -1; height: 8px; }
.mt .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.mt.hit .v { color: var(--alert); } .mt.hit .bar > i { background: var(--alert); }
@media (max-width: 1200px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>얼굴 + 행동 · 3안 분석 · 조절형</b><small>판정 기준과 규칙 숫자를 보며 맞추기</small></div>
  <span class="mock">가짜 데이터</span>
  <nav class="nav" aria-label="시안 이동"></nav>
</header>
<div class="band" id="band" aria-live="polite"></div>
<div class="halves">
  <section class="half" aria-label="얼굴 추론">
    <div class="hh"><b>👤 얼굴 추론</b><small id="fNow">—</small></div>
    <div class="cam"><canvas id="cvF"></canvas><span class="tag" id="tagF">—</span></div>
    <div class="two">
      <div class="card tune"><h3><span>얼굴 판정 기준</span><button class="chip hold" id="reset" style="border:0;cursor:pointer">처음 값</button></h3>
        <label for="th">일치 기준 <output id="thO"></output><input id="th" type="range" min="0.4" max="0.9" step="0.01"></label>
        <label for="vo">확정 장수 (5장 중) <output id="voO"></output><input id="vo" type="range" min="1" max="5" step="1"></label>
        <label for="mp">최소 얼굴 크기 <output id="mpO"></output><input id="mp" type="range" min="10" max="80" step="5"></label>
        <p class="muted" style="font-size:11.5px;margin:0">바꾸면 다음 사람부터 판정이 달라져요.</p>
      </div>
      <div class="card"><h3><span>다녀간 사람</span></h3><div class="gal" id="gal" style="grid-template-columns:1fr"></div></div>
    </div>
  </section>
  <section class="half" aria-label="행동 추론">
    <div class="hh"><b>🏃 행동 추론</b><small>하얀 점 = 판단에 쓰인 몸 점</small></div>
    <div class="cam"><canvas id="cvP"></canvas><span class="tag" id="tagP">—</span></div>
    <div class="two">
      <div class="card"><h3><span>규칙 숫자</span></h3><div id="mt"></div></div>
      <div class="card"><h3><span>위험 행동 9가지</span><a href="danger_actions.html" style="color:var(--info);font-size:12px">규칙 →</a></h3><div id="dl"></div></div>
    </div>
  </section>
</div>

<script src="cam_mock.js"></script>
<script src="combo_ui.js"></script>
<script>
const M = CamMock, U = ComboUI; M.nav("combo3");
const DEF = { ...M.FACE_RULE }, rule = { ...DEF };
const sim = M.comboSim({ frameW: 640, rule, offset: +(new URLSearchParams(location.search).get("t") || 0) });
const $ = (id) => document.getElementById(id);
function bind() { $("th").value = rule.match; $("vo").value = rule.votes; $("mp").value = rule.minPx;
  $("thO").textContent = rule.match.toFixed(2); $("voO").textContent = `${rule.votes}장`; $("mpO").textContent = `${rule.minPx}px`; }
$("th").oninput = (e) => { rule.match = +e.target.value; bind(); };
$("vo").oninput = (e) => { rule.votes = +e.target.value; bind(); };
$("mp").oninput = (e) => { rule.minPx = +e.target.value; bind(); };
$("reset").onclick = () => { Object.assign(rule, DEF); bind(); };
bind();
const METERS = [["torso", "몸 기울기", 0, 90, 55, 1, "°"], ["knee", "무릎 각도", 40, 180, 110, -1, "°"], ["wrist", "손목 속도", 0, 3, 1.2, 1, ""],
  ["ankle", "발목 속도", 0, 3, 0.8, 1, ""], ["grow", "몸 크기 변화", -40, 80, 25, 1, "%/초"], ["arm", "팔 뻗음", 0, 0.5, 0.22, 1, ""], ["turns", "방향 바꿈", 0, 6, 3, 1, "번"]];
$("mt").innerHTML = METERS.map(([k, n, lo, hi, th]) => `<div class="mt" id="m-${k}"><span>${n} <span class="muted">(기준 ${th})</span></span><span class="v" id="v-${k}">—</span>
  <div class="bar"><i id="b-${k}"></i><span class="th" style="left:${((th - lo) / (hi - lo)) * 100}%"></span></div></div>`).join("");
let acc = 0;
M.loop((dt) => {
  const st = sim.step(dt);
  U.drawFaceView($("cvF"), st); U.drawPoseView($("cvP"), st, null, { hot: true });
  $("tagF").textContent = $("tagP").textContent = M.clock(st.t);
  acc += dt; if (acc < 0.15) return; acc = 0;
  U.band($("band"), st);
  const p = st.person;
  $("fNow").textContent = p ? `${U.V[p.state].ko} · 범인 명단 최고 ${p.best} ${p.score.toFixed(2)} · ${p.px.toFixed(0)}px` : "사람 없음";
  U.dangerList($("dl"), p ? st : { active: [] });
  U.gallery($("gal"), st, { max: 5 });
  for (const [k, , lo, hi, th, dir, u] of METERS) {
    const v = p ? st.m[k] : 0, hit = p && (dir > 0 ? v >= th : v < th);
    $(`v-${k}`).textContent = p ? `${k === "turns" ? v : v.toFixed(k === "wrist" || k === "ankle" || k === "arm" ? 2 : 0)}${u}` : "—";
    $(`b-${k}`).style.width = `${Math.max(0, Math.min(1, (v - lo) / (hi - lo))) * 100}%`;
    $(`m-${k}`).className = `mt${hit ? " hit" : ""}`;
  }
});
</script>
</body>
</html>
