<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼굴 추론 2안 · 얼굴 갤러리형</title>
<link rel="stylesheet" href="cam_style.css">
<style>
/* 2안: 지나간 사람마다 얼굴 카드 한 장. 경고·미등록이 맨 앞에 와서 "누가 다녀갔나"를 한눈에 본다. */
.wrap { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; border-top: 3px solid var(--line); }
.stat b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.watch { border-top-color: var(--alert); } .stat.watch b { color: #ff8c86; }
.stat.unknown { border-top-color: var(--mid); } .stat.unknown b { color: var(--mid); }
.stat.allow { border-top-color: var(--ok); } .stat.allow b { color: var(--ok); }
.row { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 14px; align-items: start; }
.cam { aspect-ratio: 4 / 3; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.face { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--hold); }
.face.watch { border-left-color: var(--alert); } .face.unknown { border-left-color: var(--mid); } .face.allow { border-left-color: var(--ok); }
.face.live { box-shadow: 0 0 0 1px var(--info); }
.face .head { display: flex; gap: 10px; align-items: center; }
.face canvas { width: 64px; height: 64px; border-radius: 10px; background: #000; flex: none; }
.face .name { font-weight: 700; font-size: 14px; }
.face .meta { font-size: 11.5px; color: var(--muted); }
.sims { display: grid; grid-template-columns: 62px minmax(0, 1fr) 32px; gap: 3px 6px; align-items: center; font-size: 11.5px; }
.empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
@media (max-width: 860px) { .row { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>얼굴 추론 · 2안 얼굴 갤러리형</b><small>다녀간 사람을 카드로 모아 보기</small></div>
  <span class="mock">가짜 데이터</span>
  <nav class="nav" aria-label="시안 이동"></nav>
</header>
<div class="wrap">
  <div class="stats">
    <div class="stat watch"><b id="nWatch">0</b><span>경고 (범인 역할)</span></div>
    <div class="stat unknown"><b id="nUnknown">0</b><span>미등록 (침입자 의심)</span></div>
    <div class="stat allow"><b id="nAllow">0</b><span>허용 (팀원)</span></div>
    <div class="stat"><b id="nNow">0</b><span>지금 화면의 얼굴</span></div>
  </div>
  <div class="row">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="cam"><canvas id="cv"></canvas><span class="tag" id="camTag">—</span></div>
      <p class="muted" style="margin:0;font-size:12.5px">카드는 <b style="color:#ff8c86">경고</b> → <b style="color:var(--mid)">미등록</b> → 판정 보류 → <b style="color:var(--ok)">허용</b> 순서예요. 파란 테두리는 지금 화면에 있는 사람이에요.</p>
    </div>
    <div class="gallery" id="gal"><div class="empty">아직 지나간 사람이 없어요.</div></div>
  </div>
</div>

<script src="cam_mock.js"></script>
<script>
const M = CamMock; M.nav("face2");
const sim = M.faceSim({ frameW: 640 });
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
const people = new Map();   // track -> {verdict, name, score, sims, hue, first, last, frames}
const ORDER = { watch: 0, unknown: 1, hold: 2, allow: 3 };
let acc = 0;

function thumb(p) {
  const c = document.createElement("canvas"); c.width = 128; c.height = 128;
  const x = c.getContext("2d"); x.fillStyle = "#1b2433"; x.fillRect(0, 0, 128, 128);
  M.drawFaceAvatar(x, [0.3, 0.18, 0.7, 0.68], 128, 128, p.hue);
  return c;
}
function render(nowTrack, t) {
  const list = [...people.values()].sort((a, b) => ORDER[a.verdict] - ORDER[b.verdict] || b.last - a.last);
  const cnt = (v) => list.filter((p) => p.verdict === v).length;
  $("nWatch").textContent = cnt("watch"); $("nUnknown").textContent = cnt("unknown"); $("nAllow").textContent = cnt("allow");
  const g = $("gal"); if (!list.length) return;
  g.replaceChildren(...list.map((p) => {
    const el = document.createElement("article");
    el.className = `face ${p.verdict}${p.track === nowTrack ? " live" : ""}`;
    const top3 = Object.entries(p.sims).sort((a, b) => b[1] - a[1]).slice(0, 3);
    el.innerHTML = `<div class="head"><span class="th"></span><div><div class="name">${p.name}</div>
      <span class="chip ${p.verdict}">${M.VERDICT[p.verdict].ko}</span>
      <div class="meta">사람 #${p.track} · ${M.clock(p.first)}~${M.clock(p.last)} · ${p.frames}장</div></div></div>
      <div class="sims">${top3.map(([n, s]) => `<span>${n}</span><div class="bar"><i style="width:${s * 100}%;background:${s >= M.FACE_RULE.match ? "var(--info)" : "#3a4656"}"></i><span class="th" style="left:${M.FACE_RULE.match * 100}%"></span></div><span class="num">${s.toFixed(2)}</span>`).join("")}</div>`;
    el.querySelector(".th").replaceWith(p.img);
    return el;
  }));
}

M.loop((dt) => {
  const st = sim.step(dt);
  const { w, h } = M.fitCanvas(cv);
  M.drawScene(ctx, w, h, "CAM A · 얼굴", st.t);
  for (const f of st.faces) {
    M.drawFaceAvatar(ctx, f.box, w, h, f.hue);
    M.drawBox(ctx, f.box, w, h, M.VERDICT[f.verdict].color, `#${f.track} ${f.name}`, f.verdict === "hold");
    let p = people.get(f.track);
    if (!p) { p = { track: f.track, first: st.t, frames: 0, hue: f.hue }; p.img = thumb(p); people.set(f.track, p); }
    Object.assign(p, { verdict: f.verdict, name: f.name, score: f.score, sims: f.sims, last: st.t }); p.frames += 1;
  }
  if (people.size > 12) { const old = [...people.values()].sort((a, b) => a.last - b.last)[0]; people.delete(old.track); }
  $("camTag").textContent = `${M.clock(st.t)} · 얼굴 ${st.faces.length}`;
  $("nNow").textContent = st.faces.length;
  acc += dt; if (acc < 0.3) return; acc = 0;
  render(st.faces[0]?.track, st.t);
});
</script>
</body>
</html>
