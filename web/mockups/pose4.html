<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행동 추론 4안 · 사건 묶음형</title>
<link rel="stylesheet" href="cam_style.css">
<style>
/* 4안 (2안 타임라인 참고): 이어서 감지된 구간을 "사건" 하나로 묶어 목록으로. 누르면 타임라인에 그 구간이 표시된다. */
.top2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 14px; padding: 14px 18px 0; }
.cam { aspect-ratio: 16 / 9; }
.ep { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow: auto; }
.ep button { width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; color: var(--text); cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.ep button:hover { border-color: #33445a; }
.ep button.sel { border-color: var(--info); box-shadow: 0 0 0 1px var(--info); }
.ep button.open { border-style: dashed; }
.ep .n { font-weight: 700; font-size: 13px; }
.ep .s { grid-column: 2 / -1; font-size: 11.5px; color: var(--muted); }
.ep .d { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.tl { padding: 14px 18px 18px; }
.lanes { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 5px 10px; align-items: center; }
.lanes .nm { font-size: 13px; }
.lanes canvas { width: 100%; height: 20px; border-radius: 5px; background: #0d131b; display: block; }
.axis { grid-column: 2; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
@media (max-width: 860px) { .top2 { grid-template-columns: 1fr; } .lanes { grid-template-columns: 110px minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>행동 추론 · 4안 사건 묶음형</b><small>행동 2안(타임라인) 참고 · 이어진 감지를 사건으로 묶기</small></div>
  <span class="mock">가짜 데이터</span>
  <nav class="nav" aria-label="시안 이동"></nav>
</header>
<div class="top2">
  <div class="cam"><canvas id="cv"></canvas><span class="tag" id="camTag">—</span></div>
  <section class="card"><h3><span>사건 목록</span><span class="muted" id="epCount">0건</span></h3>
    <ul class="ep" id="ep"><li class="muted" style="font-size:13px">아직 사건이 없어요.</li></ul>
    <p class="muted" style="font-size:11.5px;margin:8px 0 0">점선 = 아직 진행 중. 사건을 누르면 아래 타임라인에 하얀 테두리로 표시돼요.</p>
  </section>
</div>
<section class="tl"><div class="card">
  <h3><span>최근 90초</span><span class="muted">같은 행동이 1.5초 안에 다시 켜지면 같은 사건으로 봐요</span></h3>
  <div class="lanes" id="lanes"></div>
</div></section>

<script src="cam_mock.js"></script>
<script>
const M = CamMock; M.nav("pose4");
const SPAN = 90, GAP = 1.5;
const sim = M.poseSim({ x: 0.45, size: 0.55 });
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const COL = { none: "#3ecf8e", low: "#f5b942", mid: "#ff8a3d", high: "#ff5a52" };
$("lanes").innerHTML = M.DANGERS.map((d) => `<span class="nm">${d.ko}</span><canvas data-l="${d.id}"></canvas>`).join("") + `<div class="axis"><span>90초 전</span><span>45초 전</span><span>지금</span></div>`;
const hist = [], episodes = [], openEp = {};
let sel = null, acc = 0, n = 0;
function drawLanes(now) {
  document.querySelectorAll("[data-l]").forEach((c) => {
    const { w, h } = M.fitCanvas(c), x = c.getContext("2d"), id = c.dataset.l, X = (t) => ((t - (now - SPAN)) / SPAN) * w;
    x.clearRect(0, 0, w, h);
    for (const e of hist) if (e.on.includes(id)) { x.fillStyle = COL[M.DANGER_BY_ID[id].level]; x.fillRect(X(e.t), 3, Math.max(2, w / 500), h - 6); }
    const s = episodes.find((e) => e.no === sel);
    if (s && s.id === id) { x.strokeStyle = "#fff"; x.lineWidth = 2; x.strokeRect(X(s.start) - 2, 1, Math.max(4, X(s.end ?? now) - X(s.start) + 4), h - 2); }
  });
}
function renderEp(now) {
  $("epCount").textContent = `${episodes.length}건`;
  if (!episodes.length) return;
  $("ep").replaceChildren(...episodes.slice(0, 30).map((e) => { const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.className = `${e.no === sel ? "sel" : ""}${e.end === undefined ? " open" : ""}`;
    const d = M.DANGER_BY_ID[e.id];
    b.innerHTML = `<span class="chip ${d.level}">${M.LEVEL[d.level].ko}</span><span class="n">사건 ${e.no} · ${d.ko}</span><span class="d">${((e.end ?? now) - e.start).toFixed(1)}초</span>
      <span class="s">${M.clock(e.start)} ~ ${e.end === undefined ? "진행 중" : M.clock(e.end)} · ${e.why}</span>`;
    b.onclick = () => { sel = sel === e.no ? null : e.no; renderEp(now); }; li.append(b); return li; }));
}
M.loop((dt) => {
  const st = sim.step(dt);
  const { w, h } = M.fitCanvas(cv);
  M.drawScene(ctx, w, h, "CAM A · 행동", st.t);
  M.drawBody(ctx, st.kps, w, h);
  M.drawSkeleton(ctx, st.kps, w, h, COL[st.risk]);
  const on = st.active.filter((a) => a.level !== "pending");
  for (const a of on) {
    const e = openEp[a.id];
    if (e && e.end !== undefined && st.t - e.end < GAP) e.end = undefined;   // 잠깐 꺼졌다 다시 켜짐 → 같은 사건
    if (!openEp[a.id] || openEp[a.id].end !== undefined) { const ne = { no: ++n, id: a.id, start: st.t, why: a.why }; episodes.unshift(ne); openEp[a.id] = ne; }
  }
  for (const id of Object.keys(openEp)) if (!on.some((a) => a.id === id) && openEp[id].end === undefined) openEp[id].end = st.t;
  if (episodes.length > 60) episodes.length = 60;
  hist.push({ t: st.t, on: on.map((a) => a.id) });
  while (hist.length && st.t - hist[0].t > SPAN) hist.shift();
  $("camTag").textContent = `${M.clock(st.t)} · ${on.map((a) => a.ko).join(" · ") || "위험 행동 없음"}`;
  acc += dt; if (acc < 0.25) return; acc = 0;
  renderEp(st.t); drawLanes(st.t);
});
</script>
</body>
</html>
