<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 3 · 사건 중심형</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --line: #e6e3dc; --text: #1d1f23; --muted: #6b6f78; --soft: #f1efe9;
  --a: #2f6fdf; --b: #138a5c; --c: #c9870a; --ok: #138a5c; --warn: #c9870a; --alert: #d93a30;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); transition: background .4s, color .4s; min-height: 100vh; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 16px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.btn.danger { background: var(--alert); border-color: var(--alert); color: #fff; }

/* ---------- 평소 화면 ---------- */
.calm { display: flex; align-items: center; gap: 18px; padding: 26px 32px 18px; flex-wrap: wrap; }
.status { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 280px; }
.status .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 6px rgba(19,138,92,.15); flex: none; }
.status .dot.warn { background: var(--warn); box-shadow: 0 0 0 6px rgba(201,135,10,.18); }
.status .dot.alert { background: var(--alert); box-shadow: 0 0 0 6px rgba(217,58,48,.2); }
.status h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; line-height: 1.2; }
.status p { margin: 2px 0 0; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 32px 16px; }
.chips span { padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--soft); }
.chips span.now { background: var(--text); color: var(--bg); }

.normal { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; padding: 0 32px 80px; }
.normal[hidden], .incident[hidden] { display: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.mapc { padding: 14px; }
#map { width: 100%; aspect-ratio: 6.6 / 4.6; display: block; border-radius: 12px; }
.aside { display: grid; gap: 20px; align-content: start; }
.roster { padding: 6px 0; }
.rrow { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.rrow:last-child { border-bottom: 0; }
.rrow .thumb { position: relative; width: 74px; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: #222; }
.rrow .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.rrow .thumb b { position: absolute; left: 4px; top: 3px; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 11px; display: grid; place-items: center; }
.rrow .t1 { display: flex; align-items: baseline; gap: 8px; }
.rrow .t1 b { font-size: 14px; }
.rrow .t1 span { margin-left: auto; font-size: 12px; color: var(--muted); }
.rrow .t2 { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.mini { width: 54px; height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--ok); }
.mini.warn i { background: var(--warn); } .mini.alert i { background: var(--alert); }
.txt-warn { color: var(--warn); font-weight: 700; } .txt-alert { color: var(--alert); font-weight: 700; }
.recent { padding: 14px 16px; }
.recent h2, .ipanel h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; }
.recent ul, .ilog { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.recent li, .ilog li { padding: 6px 0; border-bottom: 1px dashed var(--line); display: grid; grid-template-columns: 58px 1fr; gap: 8px; }
.recent li:last-child { border-bottom: 0; }
.recent time, .ilog time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- 사건 화면 ---------- */
body.inc { --bg: #120d0e; --card: #1c1517; --line: #352629; --text: #f4ecec; --muted: #b19c9f; --soft: #2a1e21; --alert: #ff5248; }
.ihead { display: flex; align-items: center; gap: 18px; padding: 18px 28px; background: linear-gradient(90deg, #b3261e, #7a1712); color: #fff; flex-wrap: wrap; }
.ihead.suspect { background: linear-gradient(90deg, #a46b00, #6b4600); }
.ihead h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.ihead .sub { opacity: .85; font-size: 14px; }
.ihead .timer { margin-left: auto; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.ihead .btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); color: #fff; }
.ihead .btn.danger { background: #fff; color: #b3261e; border-color: #fff; }
.incident { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 320px; gap: 18px; padding: 18px 28px 80px; }
.ipanel { padding: 14px 16px; }
.bigcam { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #000; }
.bigcam canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.bigcam .cap { position: absolute; left: 10px; top: 10px; font-size: 12px; font-weight: 700; background: rgba(0,0,0,.55); padding: 3px 10px; border-radius: 99px; }
.smallcams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.smallcams .bigcam { aspect-ratio: 4 / 3; }
#zmap { width: 100%; aspect-ratio: 1; display: block; border-radius: 12px; }
.zcap { margin-top: 10px; display: grid; gap: 6px; font-size: 13px; }
.zcap div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 5px; }
.zcap span { color: var(--muted); }
.zcap b { font-variant-numeric: tabular-nums; }
.check { list-style: none; margin: 0 0 14px; padding: 0; }
.check li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding: 8px 0; color: var(--muted); }
.check .c { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.check li.done { color: var(--text); }
.check li.done .c { background: #2f9e6a; border-color: #2f9e6a; color: #fff; }
.check li.now { color: var(--text); font-weight: 700; }
.check li.now .c { border-color: var(--alert); color: var(--alert); animation: blink 1s infinite alternate; }
@keyframes blink { to { box-shadow: 0 0 0 5px rgba(255,82,72,.25); } }
.handover { width: 100%; padding: 14px; border-radius: 12px; border: 0; background: #2f9e6a; color: #fff; font-weight: 800; font-size: 16px; margin-bottom: 14px; }
.handover:disabled { background: var(--soft); color: var(--muted); cursor: default; }
.iev { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.iev img { width: 100%; border-radius: 6px; display: block; aspect-ratio: 4 / 3; object-fit: cover; }
.iev:empty::before { content: "포위가 끝나면 증거 사진 3장이 여기에 저장됩니다."; grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.ilog { max-height: 220px; overflow-y: auto; }

@media (max-width: 1150px) {
  .incident { grid-template-columns: 1fr 1fr; }
  .incident .steps-col { grid-column: 1 / -1; }
  .normal { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .calm { padding: 18px 16px 12px; }
  .status h1 { font-size: 22px; }
  .chips { padding: 0 16px 12px; }
  .normal { padding: 0 16px 80px; }
  .ihead { padding: 14px 16px; }
  .ihead .timer { font-size: 22px; }
  .incident { grid-template-columns: 1fr; padding: 14px 16px 80px; }
}
</style>
</head>
<body>
<!-- 평소 -->
<header class="calm" id="calmHead">
  <div class="status"><span class="dot" id="dot"></span><div><h1 id="headline">순찰 중 · 이상 없음</h1><p id="sub"></p></div></div>
  <button class="btn" id="pause">일시정지</button>
  <button class="btn danger" id="estop">전체 정지</button>
</header>
<div class="chips" id="chips"></div>
<main class="normal" id="normal">
  <section class="card mapc"><canvas id="map"></canvas></section>
  <aside class="aside">
    <section class="card roster" id="roster"></section>
    <section class="card recent"><h2>최근 이벤트</h2><ul id="recent"></ul></section>
  </aside>
</main>

<!-- 사건 -->
<header class="ihead" id="ihead" hidden>
  <div><h1 id="ititle">사건 #1</h1><div class="sub" id="isub"></div></div>
  <div class="timer" id="itimer">00:00</div>
  <button class="btn danger" id="estop2">전체 정지</button>
</header>
<main class="incident" id="incident" hidden>
  <section class="card ipanel">
    <h2>카메라 · 정찰견 A (관제탑)</h2>
    <div class="bigcam"><canvas id="icamA"></canvas><span class="cap">A · 모의 영상</span></div>
    <div class="smallcams">
      <div class="bigcam"><canvas id="icamB"></canvas><span class="cap">B</span></div>
      <div class="bigcam"><canvas id="icamC"></canvas><span class="cap">C</span></div>
    </div>
  </section>
  <section class="card ipanel">
    <h2>포위 배치 (확대)</h2>
    <canvas id="zmap"></canvas>
    <div class="zcap" id="zcap"></div>
  </section>
  <section class="card ipanel steps-col">
    <h2>진행 단계</h2>
    <ol class="check" id="check"></ol>
    <button class="handover" id="handover" disabled>인계 완료</button>
    <h2>증거 사진</h2>
    <div class="iev" id="iev"></div>
    <h2>이 사건의 기록</h2>
    <ul class="ilog" id="ilog"></ul>
  </section>
</main>

<script src="mock.js"></script>
<script src="design3.js"></script>
</body>
</html>
