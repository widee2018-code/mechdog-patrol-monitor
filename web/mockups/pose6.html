<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행동 추론 6안 · 게이지 + 규칙 계산형</title>
<link rel="stylesheet" href="cam_style.css">
<style>
/* 6안 (1안 게이지 참고): 게이지 + 규칙에 쓰는 숫자 계기판. 숫자가 기준선을 넘는 순간을 보며 규칙을 맞출 때 쓴다. */
.main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); gap: 14px; padding: 14px 18px 18px; }
.left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cam { aspect-ratio: 4 / 3; }
.gauge { display: flex; align-items: center; gap: 16px; }
.gauge svg { width: 130px; height: 80px; flex: none; }
.gauge .lv { font-size: 26px; font-weight: 800; }
.meters { display: flex; flex-direction: column; gap: 10px; }
.mt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: 13px; }
.mt .nm { font-weight: 600; }
.mt .v { font-variant-numeric: tabular-nums; font-weight: 700; }
.mt .bar { grid-column: 1 / -1; height: 10px; }
.mt .bar > i { transition: none; }
.mt .rl { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
.mt.hit .v { color: var(--alert); }
.mt.hit .bar > i { background: var(--alert); }
.hot { font-size: 12.5px; color: var(--muted); }
.hot b { color: var(--text); }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>행동 추론 · 6안 게이지 + 규칙 계산형</b><small>행동 1안(게이지) 참고 · 규칙 숫자와 기준선</small></div>
  <span class="mock">가짜 데이터</span>
  <nav class="nav" aria-label="시안 이동"></nav>
</header>
<main class="main">
  <div class="left">
    <div class="cam"><canvas id="cv"></canvas><span class="tag" id="camTag">—</span></div>
    <section class="card" aria-live="polite">
      <div class="gauge">
        <svg viewBox="0 0 150 90" aria-hidden="true">
          <path d="M15 80 A60 60 0 0 1 135 80" fill="none" stroke="#1a2330" stroke-width="14" stroke-linecap="round"/>
          <path id="arc" d="M15 80 A60 60 0 0 1 135 80" fill="none" stroke="var(--ok)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
        </svg>
        <div><div class="lv" id="lv">안전</div><div id="act">위험한 행동이 없어요</div><div class="hot" id="hot">하얀 점 = 지금 판단에 쓰인 몸 점</div></div>
      </div>
    </section>
  </div>
  <section class="card"><h3><span>규칙 계산 (후처리 숫자)</span><a href="danger_actions.html" style="color:var(--info);font-size:12px">규칙 보기 →</a></h3>
    <div class="meters" id="meters"></div>
  </section>
</main>

<script src="cam_mock.js"></script>
<script>
const M = CamMock; M.nav("pose6");
const sim = M.poseSim({ x: 0.45, size: 0.5 });
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const COL = { none: "#3ecf8e", low: "#f5b942", mid: "#ff8a3d", high: "#ff5a52" };
const PCT = { none: 12, low: 40, mid: 68, high: 95 };
// [키, 이름, 최소, 최대, 기준, 넘는 방향(1 = 크면, -1 = 작으면), 단위, 쓰는 행동]
const METERS = [
  ["torso", "몸 기울기", 0, 90, 55, 1, "°", "넘어짐 · 쓰러진 채"],
  ["knee", "무릎 각도 (작은 쪽)", 40, 180, 110, -1, "°", "웅크림"],
  ["wrist", "손목 속도", 0, 3, 1.2, 1, "", "팔 휘두름 (초당 키의 몇 배)"],
  ["ankle", "발목 속도", 0, 3, 0.8, 1, "", "발차기"],
  ["grow", "몸 크기 변화", -40, 80, 25, 1, "%/초", "돌진"],
  ["size", "몸 높이 (화면 대비)", 0, 100, 75, 1, "%", "손 뻗음 (가까움 조건)"],
  ["arm", "팔 뻗음", 0, 0.5, 0.22, 1, "", "손 뻗음"],
  ["motion", "전체 움직임", 0, 1.5, 0.15, -1, "", "쓰러진 채 움직임 없음"],
  ["turns", "20초 안 방향 바꿈", 0, 6, 3, 1, "번", "배회"],
];
$("meters").innerHTML = METERS.map(([k, n, lo, hi, th, dir, u, use]) => `<div class="mt" id="m-${k}"><span class="nm">${n}</span><span class="v" id="v-${k}">—</span>
  <div class="bar"><i id="b-${k}"></i><span class="th" style="left:${((th - lo) / (hi - lo)) * 100}%"></span></div>
  <span class="rl">기준 ${dir > 0 ? "" : "미만 "}${th}${u}${dir > 0 ? " 이상" : ""} → ${use}</span></div>`).join("");
let acc = 0;
M.loop((dt) => {
  const st = sim.step(dt);
  const { w, h } = M.fitCanvas(cv);
  const on = st.active.filter((a) => a.level !== "pending");
  const hot = [...new Set(st.active.flatMap((a) => M.DANGER_KPS[a.id] || []))];
  M.drawScene(ctx, w, h, "CAM A · 행동", st.t);
  M.drawBody(ctx, st.kps, w, h);
  M.drawSkeleton(ctx, st.kps, w, h, COL[st.risk], { hot });
  $("camTag").textContent = `${M.clock(st.t)} · 시험용 정답: ${st.truthKo}`;
  acc += dt; if (acc < 0.12) return; acc = 0;
  $("lv").textContent = M.LEVEL[st.risk].ko; $("lv").style.color = COL[st.risk];
  $("act").textContent = st.active.length ? st.active.map((a) => a.ko + (a.level === "pending" ? " (확인 중)" : "")).join(", ") : "위험한 행동이 없어요";
  $("arc").setAttribute("stroke", COL[st.risk]); $("arc").setAttribute("stroke-dasharray", `${PCT[st.risk]} 100`);
  $("hot").innerHTML = hot.length ? `하얀 점 = 판단에 쓰인 몸 점: <b>${hot.map((i) => M.KP_KO[i]).join(", ")}</b>` : "하얀 점 = 지금 판단에 쓰인 몸 점";
  for (const [k, , lo, hi, th, dir, u] of METERS) {
    const v = st.m[k], hit = dir > 0 ? v >= th : v < th;
    $(`v-${k}`).textContent = `${k === "turns" ? v : v.toFixed(k === "torso" || k === "knee" || k === "grow" || k === "size" ? 0 : 2)}${u}`;
    $(`b-${k}`).style.width = `${Math.max(0, Math.min(1, (v - lo) / (hi - lo))) * 100}%`;
    $(`m-${k}`).className = `mt${hit ? " hit" : ""}`;
  }
});
</script>
</body>
</html>
