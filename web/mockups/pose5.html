<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행동 추론 5안 · 행동 히트맵 · 분석형</title>
<link rel="stylesheet" href="cam_style.css">
<style>
/* 5안 (2안의 타임라인 · 몸 점 신뢰도 부분 참고): 카메라는 작게, 분석을 크게.
   행동 9줄을 2초 칸 히트맵으로, 행동마다 횟수 · 시간 · 정답과 맞은 비율, 몸 점 17개 신뢰도도 시간축 히트맵으로. */
.wrap { padding: 14px 18px 18px; display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 14px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cam { aspect-ratio: 4 / 3; }
.now { display: flex; gap: 6px; flex-wrap: wrap; min-height: 26px; }
.mainc { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hm { display: grid; grid-template-columns: 170px minmax(0, 1fr) 54px 54px 62px; gap: 4px 10px; align-items: center; font-size: 12.5px; }
.hm .h { color: var(--muted); font-size: 11.5px; font-weight: 700; }
.hm canvas { width: 100%; height: 20px; display: block; border-radius: 4px; background: #0d131b; }
.hm .nm { display: flex; gap: 6px; align-items: center; min-width: 0; }
.hm .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.hm .num { text-align: right; }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.kpm { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 2px 10px; align-items: center; font-size: 11px; }
.kpm canvas { width: 100%; height: 11px; display: block; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 8px; }
.scale i { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #3a1e22, #4a5870, #4da3ff); }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } .hm { grid-template-columns: 110px minmax(0, 1fr) 40px 44px 50px; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>행동 추론 · 5안 행동 히트맵 · 분석형</b><small>행동 2안(타임라인 · 몸 점 신뢰도) 참고 · 분석을 크게</small></div>
  <span class="mock">가짜 데이터</span>
  <nav class="nav" aria-label="시안 이동"></nav>
</header>
<div class="wrap">
  <div class="side">
    <div class="cam"><canvas id="cv"></canvas><span class="tag" id="camTag">—</span></div>
    <section class="card" aria-live="polite"><h3><span>지금 감지된 행동</span></h3><div class="now" id="now"></div></section>
    <section class="card"><h3><span>요약 (시작부터)</span></h3>
      <div class="muted" style="font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px">
        <span>지켜본 시간</span><b class="num" id="sT">—</b><span>위험 행동 켜진 시간</span><b class="num" id="sR">—</b><span>정답과 맞은 비율</span><b class="num" id="sA">—</b>
      </div>
    </section>
  </div>
  <div class="mainc">
    <section class="card">
      <h3><span>행동 히트맵 (최근 2분, 2초 칸)</span><span class="muted">진할수록 그 2초 동안 오래 켜짐</span></h3>
      <div class="hm" id="hm"></div>
    </section>
    <section class="card">
      <h3><span>몸 점 17개 신뢰도 (최근 2분)</span><span class="muted">어두운 칸 = 0.5 미만, 규칙에서 뺌</span></h3>
      <div class="kpm" id="kpm"></div>
      <div class="scale"><span>0.5 미만</span><i></i><span>1.0</span></div>
    </section>
  </div>
</div>

<script src="cam_mock.js"></script>
<script>
const M = CamMock; M.nav("pose5");
const SPAN = 120, BIN = 2, NB = SPAN / BIN;
const sim = M.poseSim({ x: 0.45, size: 0.5 });
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const COL = { none: "#3ecf8e", low: "#f5b942", mid: "#ff8a3d", high: "#ff5a52" };
const RGB = { low: [245, 185, 66], mid: [255, 138, 61], high: [255, 90, 82] };
// 정답 행동 → 이 행동이 나오면 맞은 것으로 보는 위험 행동
const EXPECT = { loiter: "loiter", crouch: "crouch", handsup: "handsup", rush: "rush", reach: "reach", strike: "strike", kick: "kick", fall: "fall", still: "still" };
$("hm").innerHTML = `<span class="h">행동</span><div class="axis"><span>2분 전</span><span>1분 전</span><span>지금</span></div><span class="h num">횟수</span><span class="h num">시간</span><span class="h num">맞음</span>`
  + M.DANGERS.map((d) => `<span class="nm" title="${d.rule}"><i class="dot" style="background:${COL[d.level]}"></i><span>${d.ko}</span></span><canvas data-h="${d.id}"></canvas>
    <span class="num" id="n-${d.id}">0</span><span class="num" id="s-${d.id}">0초</span><span class="num muted" id="a-${d.id}">—</span>`).join("");
$("kpm").innerHTML = M.KP_KO.map((n, i) => `<span>${n}</span><canvas data-k="${i}"></canvas>`).join("");
const hist = [];
const stat = Object.fromEntries(M.DANGERS.map((d) => [d.id, { n: 0, sec: 0, truthSec: 0, hitSec: 0, was: false }]));
let total = 0, riskSec = 0, okSec = 0, judged = 0, acc = 0;
function bins(now, pick) {   // 칸마다 (켜진 장수 / 전체 장수)
  const on = new Array(NB).fill(0), all = new Array(NB).fill(0);
  for (const e of hist) { const b = Math.floor((e.t - (now - SPAN)) / BIN); if (b < 0 || b >= NB) continue; all[b] += 1; on[b] += pick(e); }
  return on.map((v, i) => (all[i] ? v / all[i] : -1));
}
function draw(now) {
  document.querySelectorAll("[data-h]").forEach((c) => {
    const id = c.dataset.h, lv = M.DANGER_BY_ID[id].level, [r, g, b] = RGB[lv];
    const { w, h } = M.fitCanvas(c), x = c.getContext("2d"), bw = w / NB;
    x.clearRect(0, 0, w, h);
    bins(now, (e) => (e.on.includes(id) ? 1 : 0)).forEach((v, i) => { if (v <= 0) return; x.fillStyle = `rgba(${r},${g},${b},${0.25 + 0.75 * v})`; x.fillRect(i * bw + 1, 2, bw - 2, h - 4); });
  });
  document.querySelectorAll("[data-k]").forEach((c) => {
    const i = +c.dataset.k, { w, h } = M.fitCanvas(c), x = c.getContext("2d"), bw = w / NB;
    x.clearRect(0, 0, w, h);
    const sum = new Array(NB).fill(0), cnt = new Array(NB).fill(0);
    for (const e of hist) { const b = Math.floor((e.t - (now - SPAN)) / BIN); if (b < 0 || b >= NB) continue; sum[b] += e.kc[i]; cnt[b] += 1; }
    sum.forEach((s, j) => { if (!cnt[j]) return; const v = s / cnt[j];
      x.fillStyle = v < 0.5 ? "#3a1e22" : `rgb(${Math.round(74 + (77 - 74) * (v - 0.5) * 2)},${Math.round(88 + (163 - 88) * (v - 0.5) * 2)},${Math.round(112 + (255 - 112) * (v - 0.5) * 2)})`;
      x.fillRect(j * bw, 0, bw - 1, h); });
  });
}
M.loop((dt) => {
  const st = sim.step(dt);
  const { w, h } = M.fitCanvas(cv);
  M.drawScene(ctx, w, h, "CAM A · 행동", st.t);
  M.drawBody(ctx, st.kps, w, h);
  M.drawSkeleton(ctx, st.kps, w, h, COL[st.risk]);
  const on = st.active.filter((a) => a.level !== "pending").map((a) => a.id);
  // 일부 몸 점은 가끔 가려진 것처럼 신뢰도를 낮춘다 (다리만 보이는 낮은 카메라 흉내)
  const kc = st.kps.map((k, i) => (i <= 4 && Math.sin(st.t * 0.21) > 0.6 ? 0.35 : k[2]));
  hist.push({ t: st.t, on, kc }); while (hist.length && st.t - hist[0].t > SPAN) hist.shift();
  total += dt; if (on.length) riskSec += dt;
  const exp = EXPECT[st.truth];
  for (const d of M.DANGERS) { const s = stat[d.id], now = on.includes(d.id);
    if (now) s.sec += dt; if (now && !s.was) s.n += 1; s.was = now;
    if (exp === d.id) { s.truthSec += dt; if (now) s.hitSec += dt; } }
  if (exp || on.length) { judged += dt; if ((exp && on.includes(exp)) || (!exp && !on.length)) okSec += dt; } else { judged += dt; okSec += dt; }
  $("camTag").textContent = `${M.clock(st.t)} · 시험용 정답: ${st.truthKo}`;
  acc += dt; if (acc < 0.3) return; acc = 0;
  $("now").innerHTML = st.active.length ? st.active.map((a) => `<span class="chip ${a.level}" title="${a.why}">${a.ko}${a.level === "pending" ? " (확인 중)" : ""}</span>`).join("") : '<span class="chip none">위험 행동 없음</span>';
  for (const d of M.DANGERS) { const s = stat[d.id];
    $(`n-${d.id}`).textContent = s.n; $(`s-${d.id}`).textContent = `${s.sec.toFixed(0)}초`;
    $(`a-${d.id}`).textContent = s.truthSec > 0.5 ? `${Math.round((s.hitSec / s.truthSec) * 100)}%` : "—"; }
  $("sT").textContent = M.clock(total); $("sR").textContent = `${M.clock(riskSec)} (${Math.round((riskSec / Math.max(1, total)) * 100)}%)`;
  $("sA").textContent = `${Math.round((okSec / Math.max(0.1, judged)) * 100)}%`;
  draw(st.t);
});
</script>
</body>
</html>
