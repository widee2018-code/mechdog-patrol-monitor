<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼굴 추론 4안 · 명단 칸반형</title>
<link rel="stylesheet" href="cam_style.css">
<style>
/* 4안 (2안 갤러리 참고): 카드를 판정별 세 칸(경고 · 미등록 · 허용)에 쌓는다. 칸 길이만 봐도 상황이 보인다. */
.wrap { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.strip { display: grid; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.cam { aspect-ratio: 4 / 3; }
.live { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.live .big { font-size: 24px; font-weight: 800; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.col { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.col > header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; padding: 2px 4px 6px; border-bottom: 2px solid var(--line); }
.col.watch > header { border-bottom-color: var(--alert); color: #ff8c86; }
.col.unknown > header { border-bottom-color: var(--mid); color: var(--mid); }
.col.hold > header { border-bottom-color: var(--hold); color: var(--muted); }
.col.allow > header { border-bottom-color: var(--ok); color: var(--ok); }
.col > header b { font-size: 18px; font-variant-numeric: tabular-nums; }
.k { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; }
.k.live-now { box-shadow: 0 0 0 1px var(--info); }
.k canvas { width: 44px; height: 44px; border-radius: 8px; }
.k .n { font-weight: 700; font-size: 13px; }
.k .s { font-size: 11.5px; color: var(--muted); }
.col .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 0; }
@media (max-width: 960px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } .strip { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>얼굴 추론 · 4안 명단 칸반형</b><small>얼굴 2안(갤러리) 참고 · 판정별 칸에 쌓기</small></div>
  <span class="mock">가짜 데이터</span>
  <nav class="nav" aria-label="시안 이동"></nav>
</header>
<div class="wrap">
  <div class="strip">
    <div class="cam"><canvas id="cv"></canvas><span class="tag" id="camTag">—</span></div>
    <section class="card live" aria-live="polite">
      <h3><span>지금 화면</span><span class="num" id="trk">—</span></h3>
      <div class="big" id="big">사람 없음</div>
      <div class="muted" id="sub">—</div>
      <div class="muted" style="font-size:12px">새 사람이 판정되면 오른쪽 칸으로 카드가 옮겨 가요. 같은 사람은 판정이 바뀌면 칸을 옮겨요.</div>
    </section>
  </div>
  <div class="board" id="board"></div>
</div>

<script src="cam_mock.js"></script>
<script>
const M = CamMock; M.nav("face4");
const sim = M.faceSim({ frameW: 640 });
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const COLS = [["watch", "경고 (범인 역할)"], ["unknown", "미등록 (침입자 의심)"], ["hold", "판정 보류"], ["allow", "허용 (팀원)"]];
$("board").innerHTML = COLS.map(([k, t]) => `<section class="col ${k}"><header><span>${t}</span><b id="c-${k}">0</b></header><div id="l-${k}"><div class="empty">없음</div></div></section>`).join("");
const people = new Map();
function thumb(hue) { const c = document.createElement("canvas"); c.width = 88; c.height = 88; const x = c.getContext("2d");
  x.fillStyle = "#1b2433"; x.fillRect(0, 0, 88, 88); M.drawFaceAvatar(x, [0.28, 0.18, 0.72, 0.7], 88, 88, hue); return c; }
let acc = 0;
M.loop((dt) => {
  const st = sim.step(dt);
  const { w, h } = M.fitCanvas(cv);
  M.drawScene(ctx, w, h, "CAM A · 얼굴", st.t);
  const f = st.faces[0];
  if (f) {
    M.drawFaceAvatar(ctx, f.box, w, h, f.hue);
    M.drawBox(ctx, f.box, w, h, M.VERDICT[f.verdict].color, `#${f.track} ${f.name}`, f.verdict === "hold");
    let p = people.get(f.track);
    if (!p) { p = { track: f.track, first: st.t, img: thumb(f.hue) }; people.set(f.track, p); }
    Object.assign(p, { verdict: f.verdict, name: f.name, score: f.score, last: st.t });
  }
  if (people.size > 14) people.delete([...people.values()].sort((a, b) => a.last - b.last)[0].track);
  $("camTag").textContent = `${M.clock(st.t)} · 얼굴 ${st.faces.length}`;
  acc += dt; if (acc < 0.3) return; acc = 0;
  $("big").textContent = f ? M.VERDICT[f.verdict].ko : "사람 없음"; $("big").style.color = f ? M.VERDICT[f.verdict].color : "var(--muted)";
  $("sub").textContent = f ? `${f.best} 와(과) ${f.score.toFixed(2)} 일치 · 얼굴 ${f.px.toFixed(0)}px` : "—";
  $("trk").textContent = f ? `사람 #${f.track}` : "—";
  for (const [k] of COLS) {
    const list = [...people.values()].filter((p) => p.verdict === k).sort((a, b) => b.last - a.last);
    $(`c-${k}`).textContent = list.length;
    const box = $(`l-${k}`);
    if (!list.length) { box.innerHTML = '<div class="empty">없음</div>'; continue; }
    box.replaceChildren(...list.map((p) => { const el = document.createElement("div");
      el.className = `k${f && p.track === f.track ? " live-now" : ""}`;
      el.innerHTML = `<span class="ph"></span><div><div class="n">${p.name}</div><div class="s">사람 #${p.track} · ${p.verdict === "hold" ? "확인 중" : p.score.toFixed(2)} · ${M.clock(p.last)}</div></div>`;
      el.querySelector(".ph").replaceWith(p.img); return el; }));
  }
});
</script>
</body>
</html>
