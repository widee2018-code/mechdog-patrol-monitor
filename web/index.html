<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MechDog 관제실</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>MechDog 관제실</b><small>행렬 순찰 · 실시간 모니터 · <span class="conn" id="conn">연결 끊김</span></small></div>
  <div class="siren" id="siren" role="status" aria-live="assertive">
    <svg class="lamp" viewBox="0 0 48 48" aria-hidden="true">
      <g class="rays"><path d="M24 2v6M7 10l5 4.5M41 10l-5 4.5M2 25h6M46 25h-6"/></g>
      <path class="dome" d="M12 37V26a12 12 0 0 1 24 0v11z"/>
      <path class="shine" d="M17.5 27a6.5 6.5 0 0 1 6.5-6.5"/>
      <rect class="base" x="7" y="37" width="34" height="7" rx="2"/>
    </svg>
    <div class="siren-txt"><b id="sirenState">사이렌 대기</b><small id="sirenSub">알림이 꺼져 있어요</small></div>
    <button class="btn sm" id="sirenArm">🔔 알림 켜기</button>
    <button class="btn sm danger" id="sirenAck" hidden>확인</button>
  </div>
  <ol class="steps" id="steps"></ol>
  <div class="top-act">
  <span class="btn found" data-found id="foundTop" role="status" hidden title="카메라 사람 인식(YOLO)이 사람을 찾으면 불이 들어와요">👤 발견</span>
  <button class="btn hold" data-standby id="standby" hidden title="탐사 중: B·C 일시정지 · 사람 발견 중: 범인 아님(오탐) · B·C는 teleop 창으로 줄 맞추기 · A는 조종하는 사람이 멈추세요">⏸ 대기</button>
  <button class="btn contain" data-contain id="containTop" hidden disabled title="사람을 발견(SUSPECT)했을 때 범인이면 누르세요. B·C가 사람 조종으로 바뀌어요">◎ 포위</button>
  </div>
  <span class="clock" id="clock"></span>
</header>

<div class="banner" id="banner" hidden></div>

<section class="ready" id="ready" aria-label="시작 준비 확인">
  <div class="ready-head">
    <div><b>시작 준비 확인 · STANDBY</b><small id="readySub">세 마리를 일렬로 세우고 모든 항목이 초록이 되면 탐사를 시작하세요</small></div>
    <div class="ready-act">
      <span class="btn found" data-found role="status" title="카메라 사람 인식(YOLO)이 사람을 찾으면 불이 들어와요">👤 발견</span>
      <button class="btn hold" data-standby disabled title="이미 대기 중이에요. 탐사를 시작하면 누를 수 있어요">⏸ 대기</button>
      <button class="btn contain" data-contain disabled title="사람을 발견(SUSPECT)했을 때 범인이면 누르세요. B·C가 사람 조종으로 바뀌어요">◎ 포위</button>
      <button class="btn go" id="start" disabled title="B·C가 앞 개 마커를 인식하면 누를 수 있어요">▶ 탐사 시작</button>
    </div>
  </div>
  <div class="ready-grid" id="readyGrid"></div>
</section>

<main>
  <section class="panel map">
    <div class="ph">
      <h2>공간 지도</h2><span class="meta" id="mapmeta"></span>
      <div class="legend">
        <span><i style="background:#5ee1ff"></i>LiDAR</span>
        <span><i style="background:var(--alert)"></i>침입자</span>
      </div>
    </div>
    <div class="mapbox"><canvas id="map"></canvas></div>
  </section>

  <section class="cams" id="cams"></section>
  <section class="dogs" id="dogs"></section>

  <section class="panel log">
    <div class="ph"><h2>이벤트</h2><span class="meta" id="evcount"></span></div>
    <ul id="log"></ul>
  </section>

  <section class="panel ev">
    <div class="ph"><h2>증거 사진</h2><span class="meta" id="evidenceCount"></span></div>
    <div class="evidence" id="evidence"></div>
  </section>
</main>

<nav class="pages" aria-label="화면 이동">
  <a href="./" aria-current="page">관제실</a><a href="mockups/combo2.html">추론</a>
</nav>

<script src="app.js"></script>
</body>
</html>
